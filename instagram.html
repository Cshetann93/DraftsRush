<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DraftsRush - Custom Cover Frame</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&family=Inter:wght@600;700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #111317;
      color: #111317;
      padding: 30px;
    }
    .brand-font { font-family: 'Space Grotesk', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace, Courier; }

    /* Exact 9:16 aspect ratio (405x720) -> Renders cleanly to 1080x1920 */
    .reel-frame {
      width: 405px;
      height: 720px;
      position: relative;
      flex-shrink: 0;
      border: 4px solid #111317;
      box-shadow: 10px 10px 0px #000000;
      background-color: #F8D000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      overflow: hidden;
    }

    .b-card-dark {
      border: 3.5px solid #111317;
      box-shadow: 6px 6px 0px #111317;
      background-color: #111317;
      padding: 32px 20px;
      width: 100%;
    }

    .badge-pill {
      display: inline-block;
      background-color: #F8D000;
      color: #111317;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 900;
      text-transform: uppercase;
      font-size: 11px;
      padding: 6px 12px;
      line-height: 1;
      margin-bottom: 20px;
      border: 2px solid #111317;
      white-space: nowrap;
    }

    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-center { justify-content: center; }
    .text-center { text-align: center; }
    .w-full { width: 100%; }
    .uppercase { text-transform: uppercase; }
  </style>
</head>
<body class="flex flex-col items-center justify-center">

  <!-- Download & Action Bar -->
  <div class="w-full max-w-md mb-6 flex items-center justify-between gap-4 border-4 border-black p-4" style="background-color: #F8D000; box-shadow: 6px 6px 0px #111317;">
    <div>
      <h1 class="brand-font" style="font-weight: 900; font-size: 16px; text-transform: uppercase; letter-spacing: -0.02em;">Custom Instagram Frame</h1>
      <p class="font-mono" style="font-size: 10px; font-weight: 700; color: #111317; margin-top: 2px;">1080x1920 PNG EXPORT</p>
    </div>
    <button id="download-btn" onclick="downloadCoverFrame()" class="brand-font" style="background-color: #111317; color: #FFFFFF; font-weight: 900; font-size: 11px; text-transform: uppercase; border: 2px solid #111317; padding: 10px 16px; cursor: pointer; box-shadow: 3px 3px 0px #000000;">
      Download Frame
    </button>
  </div>

  <!-- Single Standalone Frame -->
  <div id="frame-cover" class="reel-frame">
    <div class="b-card-dark text-center">
      <div class="badge-pill">BEFORE SKIPPING THIS</div>
      <h2 class="brand-font" style="font-weight: 900; font-size: 22px; line-height: 1.25; color: #FFFFFF; text-transform: uppercase; letter-spacing: -0.03em;">
        Let's turn your smartphone conversation with your friend into a horror scene; try with us.
      </h2>
    </div>
  </div>

  <script>
    async function downloadCoverFrame() {
      const btn = document.getElementById('download-btn');
      btn.innerText = 'PREPARING...';
      btn.disabled = true;

      await document.fonts.ready;
      const pixelRatio = 1080 / 405; // Exact 2.666667x multiplier for 1080x1920 export

      const node = document.getElementById('frame-cover');
      btn.innerText = 'EXPORTING PNG...';

      try {
        const dataUrl = await htmlToImage.toPng(node, {
          pixelRatio: pixelRatio,
          quality: 1.0,
          skipAutoScale: true,
          cacheBust: true,
          fontEmbedCSS: true
        });

        const link = document.createElement('a');
        link.download = 'draftsrush-chat-horror-custom.png';
        link.href = dataUrl;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      } catch (error) {
        console.error('Failed rendering frame:', error);
      }

      btn.innerText = 'DOWNLOAD FRAME';
      btn.disabled = false;
    }
  </script>
</body>
</html>
