name: Technical SEO audit

on:
  pull_request:
  push:
    branches:
      - main
      - audit/technical-seo-performance-completion

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pinned CSS build dependency
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build production CSS
        run: npm run build:css
      - name: Audit canonical tags, metadata, Tailwind CDN, headings and sitemap
        run: npm run audit:seo
      - name: Upload technical SEO audit report
        uses: actions/upload-artifact@v4
        with:
          name: draftsrush-technical-seo-audit
          path: technical-seo-audit.json
          if-no-files-found: error
