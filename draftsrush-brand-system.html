<!DOCTYPE html>
<html lang="en">
<head>

  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-KFBGQ8WX');</script>
  <!-- End Google Tag Manager -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DraftsRush - Frame 01 (Title Frame)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #111317;
      color: #111317;
      margin: 0;
      padding: 24px;
    }
    .brand-font { font-family: 'Space Grotesk', sans-serif; }

    /* Exact 9:16 Reel Container */
    #reel-stage {
      width: 405px;
      height: 720px;
      position: relative;
      overflow: hidden;
      border: 4px solid #000;
      box-shadow: 12px 12px 0px #F8D000;
      background-color: #E2E4E9;
    }

    .slide {
      width: 100%;
      height: 100%;
      padding: 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .brutal-shadow { box-shadow: 6px 6px 0px #111317; }
    .brutal-shadow-sm { box-shadow: 4px 4px 0px #111317; }

    /* Slower Slide-in Animation */
    @keyframes slideFromLeftSlow {
      0% {
        transform: translateX(-120%);
        opacity: 0;
      }
      75% {
        transform: translateX(4px);
        opacity: 1;
      }
      100% {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .animate-block-1 {
      animation: slideFromLeftSlow 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .animate-block-2 {
      animation: slideFromLeftSlow 0.85s cubic-bezier(0.22, 1, 0.36, 1) 0.55s forwards;
      opacity: 0;
    }

    .animate-block-3 {
      animation: slideFromLeftSlow 0.75s cubic-bezier(0.22, 1, 0.36, 1) 1.05s forwards;
      opacity: 0;
    }

    /* Typewriter Cursor */
    .typing-cursor::after {
      content: '▋';
      display: inline-block;
      margin-left: 3px;
      color: #111317;
      animation: blink 0.7s infinite;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen">
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KFBGQ8WX"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <!-- Controls Deck -->
  <div class="mb-6 w-full max-w-[405px] flex flex-col gap-2.5 bg-[#F8D000] border-4 border-black p-3.5 brutal-shadow">
    <div class="flex items-center justify-between">
      <button onclick="replayAnimation()" class="bg-black text-white font-bold text-xs uppercase px-4 py-1.5 border-2 border-black hover:bg-gray-800">
        Replay Animation
      </button>
      <div class="text-xs font-black brand-font tracking-wider">
        FRAME 01 / 11
      </div>
    </div>
    
    <div class="grid grid-cols-2 gap-2 pt-1 border-t-2 border-black">
      <button id="btn-record" onclick="toggleRecording()" class="bg-black text-[#F8D000] font-black text-[11px] uppercase py-2 border-2 border-black hover:bg-gray-900">
        Record Video (.webm)
      </button>
      <button id="btn-download-png" onclick="downloadStillPNG()" class="bg-white text-black font-black text-[11px] uppercase py-2 border-2 border-black hover:bg-gray-100">
        Download PNG (9:16)
      </button>
    </div>
  </div>

  <!-- Stage (9:16) -->
  <div id="reel-stage">
    <div class="slide" id="slide-0">
      <div>
        <!-- Top Tags -->
        <div class="flex items-center justify-between mb-6">
          <div class="bg-black text-[#F8D000] px-3 py-1 text-xs font-black brand-font tracking-wider border-2 border-black animate-block-1">
            STORY STRATEGY
          </div>
          <div class="bg-white text-black px-3 py-1 text-xs font-bold font-mono border-2 border-black">
            01/11
          </div>
        </div>

        <!-- Title Block (Slides in First) -->
        <div class="bg-[#F8D000] border-4 border-black p-5 brutal-shadow mb-6 animate-block-1">
          <span class="bg-black text-white px-2 py-0.5 text-[10px] font-bold brand-font uppercase">The Dilemma</span>
          <h1 class="text-2xl font-black brand-font leading-tight mt-2 text-black">
            Always confused by too many ideas?
          </h1>
        </div>

        <!-- Body Card (Slides in Second, then Types) -->
        <div class="bg-white border-4 border-black p-5 brutal-shadow space-y-3 animate-block-2">
          <p class="text-sm font-bold text-gray-900 leading-snug type-text" data-text="Having 50 plot thoughts at once kills the basic flow of your story. When you try to force every thought into page one, your script loses focus."></p>
        </div>
      </div>

      <!-- Footer Action & Branding (Slides in Third) -->
      <div class="animate-block-3">
        <div class="bg-black text-white p-3 border-2 border-black flex items-center justify-between mb-3">
          <span class="brand-font font-bold text-xs uppercase tracking-wider">Follow this simple strategy</span>
          <span class="text-[#F8D000] font-black text-sm">→</span>
        </div>
        <div class="flex items-center justify-between text-[11px] font-bold tracking-wider pt-2 border-t-2 border-black">
          <span>DRAFTSRUSH STUDIO</span>
          <span>draftsrush.com</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    let typingInterval = null;

    function runTypewriter() {
      if (typingInterval) clearInterval(typingInterval);

      const container = document.querySelector('.type-text');
      const fullText = container.getAttribute('data-text') || '';
      container.textContent = '';
      container.classList.add('typing-cursor');

      // 1.1s delay to let the sliding blocks land and settle
      setTimeout(() => {
        let charIndex = 0;
        // Pacing delay (~24ms per character for readable pace)
        const speed = Math.max(22, Math.floor(3200 / fullText.length));

        typingInterval = setInterval(() => {
          if (charIndex < fullText.length) {
            container.textContent += fullText.charAt(charIndex);
            charIndex++;
          } else {
            clearInterval(typingInterval);
            container.classList.remove('typing-cursor');
          }
        }, speed);
      }, 1100);
    }

    function replayAnimation() {
      const stage = document.getElementById('reel-stage');
      const clone = stage.cloneNode(true);
      stage.parentNode.replaceChild(clone, stage);
      runTypewriter();
    }

    window.addEventListener('DOMContentLoaded', () => {
      runTypewriter();
    });

    // Capture single high-res 9:16 still image
    async function downloadStillPNG() {
      const btn = document.getElementById('btn-download-png');
      btn.innerText = 'CAPTURING...';
      btn.disabled = true;

      const container = document.querySelector('.type-text');
      container.textContent = container.getAttribute('data-text') || '';
      container.classList.remove('typing-cursor');

      await new Promise(r => setTimeout(r, 200));

      try {
        const canvas = await html2canvas(document.getElementById('reel-stage'), {
          scale: 2.6666, // Exact 1080x1920 Instagram Reel size
          useCORS: true,
          backgroundColor: null
        });

        const link = document.createElement('a');
        link.download = 'draftsrush-title-frame-01.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      } catch (err) {
        console.error('Error capturing PNG:', err);
      }

      btn.innerText = 'Download PNG (9:16)';
      btn.disabled = false;
    }

    // Direct WebM screen recording
    let mediaRecorder = null;
    let recordedChunks = [];

    async function toggleRecording() {
      const recordBtn = document.getElementById('btn-record');
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        recordBtn.innerText = 'Record Video (.webm)';
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getDisplayMedia({
          video: { displaySurface: "browser" },
          audio: false
        });

        replayAnimation();

        recordedChunks = [];
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9' });

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'draftsrush-title-frame-01.webm';
          a.click();
        };

        mediaRecorder.start();
        recordBtn.innerText = 'Stop Recording';

        // Automatically stop recording after 5.5 seconds (full animation cycle)
        setTimeout(() => {
          if (mediaRecorder && mediaRecorder.state === 'recording') {
            mediaRecorder.stop();
            recordBtn.innerText = 'Record Video (.webm)';
          }
        }, 5500);

      } catch (err) {
        alert("Screen recording was canceled or not permitted.");
      }
    }
  </script>
</body>
</html>
