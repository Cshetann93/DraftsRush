<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OPTIX // Interactive Exposure Triangle Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      --bg-chassis: #090A0D;
      --bg-panel: #111319;
      --bg-card: #171A22;
      --bg-elevated: #1F232E;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(255, 255, 255, 0.22);
      --text-main: #F3F4F6;
      --text-secondary: #9CA3AF;
      --text-dim: #6B7280;
      --accent-amber: #F59E0B;
      --accent-amber-soft: rgba(245, 158, 11, 0.14);
      --accent-red: #EF4444;
      --accent-green: #10B981;
      --accent-cyan: #38BDF8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-chassis);
      color: var(--text-main);
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
      background-image:
        radial-gradient(circle at 15% 0%, rgba(245, 158, 11, 0.06), transparent 40%),
        radial-gradient(circle at 85% 10%, rgba(56, 189, 248, 0.05), transparent 40%);
    }

    h1, h2, h3, h4, .display-font {
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: -0.025em;
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: -0.02em;
    }

    /* Top Studio Bar */
    .topbar {
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(17, 19, 25, 0.85);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .topbar-inner {
      max-width: 1440px;
      margin: 0 auto;
      padding: 0.9rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: linear-gradient(135deg, #262A36, #14171F);
      border: 1px solid rgba(255,255,255,0.16);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .brand-mark::after {
      content: '';
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent-red);
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.7);
    }

    .brand-title {
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.04em;
    }

    .brand-sub {
      font-size: 0.72rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
